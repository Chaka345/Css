    <div id="pierwszy_babiychuk">
    <p :first-child> Pierwszy akapit/pierwszy DIV --> Malik 
            <br> nazwa ID akapitu id="pierwszy_babiychuk" </p>
    <p> Drugi akapit/pierwszy DIV 
            <br> pierwszy akapit --> p:first-child {font-size7mm;font-style:italic;} 
            <br> bo numer nieparzysty w dzienniku 
            <br> pozostałe akapity --> p{font-size:11pt:} bo numer nieparzysty
            <br> szerokość bloku = 700 + 21*4 = 784pt
            <br> pierwszy DIV --> kolor jasny niebieski 
    </p>
    <p> Trzeci akapit/pierwszy DIV 
        <br> pierwszy DIV --> obramowanie granatowe DIV
        <br> pierwszy DIV --> obramowanie grubość 5px, ciągłe
        <br> pierwszy DIV --> r1 = 7px + 6 = 13px
        <br>
    </p>
    </div>
    <div id="drugi_babiychuk">
        <p :first-child> Pierwszy akapit/drugi DIV --> Oleksii <br> nazwa ID akapitu id="drugi_babiychuk" </p>
        <p> Drugi akapit/drugi DIV 
            <br> Drugi DIV --> kolor różowy
        </p>
        <p> Trzeci akapit/drugi DIV
            <br> drugi DIV --> obramowanie 3px, ciągłe 
            <br> drugi DIV --> r2 = 7px + 8 = 15px 
            <br>
        </p>
    </div>
    <div id="trzeci_babiychuk">
        <p :first-child> 
            Pierwszy akapit/trzeci DIV --> 1Kp nazwa ID akapitu id="trzeci_babiychuk"
        </p>
        <p> Drugi akapit/trzeci DIV
            <br> trzeci DIV --> kolor jasny zielony
        </p>
        <p> Trzeci akapit/trzeci DIV
            <br> trzeci DIV --> obramowanie fioletowe DIV
            <br> trzeci DIV --> obramowanie grubość 7px, ciągłe 
            <br> trzeci DIV --> r3 = 7px + 11 = 18px
        </p>
    </div>
</body>
</html>
