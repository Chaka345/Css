<!DOCTYPE html>
<html>
  <head>
    <title>Babiychuk</title>
    <meta charset="utf-8" />
    <style type="text/css">
      body {
        background-color: rgb(221, 106, 183);
        text-align: center;
        margin: 50px;
      }

      div {
        background: rgb(100, 128, 255);
        width: 400px;
        border: 3px black solid;
      }

      h1 {
        margin: 20px;
        border: 5px solid black;
        border-top-style: dotted;
        border-bottom-style: double;
        border-left-style: dashed;
        border-right-style: solid;
        background: rgb(255, 255, 0);
      }

      h2 {
        margin: 20px;
        border: 5px solid black;
        border-top-color: blue;
        border-bottom-color: green;
        border-left-color: red;
        border-right-color: purple;
        background: rgb(126, 24, 55);
      }

      h3 {
        margin: 20px;
        border: 5px solid black;
        background: rgb(68, 122, 223);
      }
    </style>
  </head>
  <body>
    <div>
      <h1>Babiychuk 1K/P</h1>
    </div>
    <div>
      <h2>Babiychuk 1K/P</h2>
    </div>
    <div>
      <h3>Babiychuk 1K/P</h3>
    </div>
  </body>
</html>
