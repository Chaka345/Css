<html>
  <head>
    <title>Babiychuk z18 kod</title>
  </head>
  <body>
    <h1>Kod HTML</h1>

    <textarea cols="80" rows="100">
<!-- początekbloku DIV 1 -->
<div style="background-color: #ff00ff; width: 1181px">
  <span style="color: #0000ff; font-size: 1.7cm; font-family: Arial">
    Znacznik DIV (blok 1)-->Babiychuk
  </span>
  <br />
  <span style="font-size: 1.3cm; font-family: Times New Roman">
    <b><u> Element blokowy (DIV)</u></b> jest elementem blokowym może zawierać
    wewnątrz siebie zwykły tekst, jak również inne elementy blokowe. Został on
    pomyślany do tworzenia obszerniejszych struktur.
  </span>
  <span
    style="
      color: #808080;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 8mm;
    "
    ><br />
    Zastosowanie DIV
    <ul type="cricle">
      <li>
        Z div'a powinno się korzystać kiedy potrzebujemy wyodrębnić poszczególne
        bloki w układzie dokumentu, na przykład lewa kolumna, menu nawigacyjne,
        stopka.
      </li>
      <li>
        Służy do utworzenia sekcji (bloku) w pliku HTML w celu ich sformatowania
        za pomocą arkusza stylów CSS.
      </li>
    </ul>
  </span>
</div>
<!-- koniec bloku DIV-->

<!-- początekbloku DIV 3 -->
<div style="background-color: #ffff00; width: 1081px">
  <span style="color: #800000; font-size: 11mm; font-family: Arial">
    Różnica między znacznikami DIV i SPAN (blok 3)→>1K/P
  </span>
  <br />
  <span
    style="
      color: #0000ff;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 7mm;
    "
    ><br />
    Zastosowanie DIV
    <ul type="square">
      <li>
        Span'em wyodrebniamy elementy liniowe (najczęściej fragmenty tekstu) a
        divem blokowe elementy, większe fragmenty struktury składające się na
        układ strony.
      </li>
      <li>
        Dodatkowo DIV domyślnie jest wyświetlany w bloku. Natomiast SPAN w
        linii.
      </li>
    </ul>
  </span>
</div>
<!-- koniec bloku DIV-->

<!-- początekbloku DIV 2 -->
<div style="background-color: #ff0000; width: 981px">
  <span style="color: #008080; font-size: 1.4 cm; font-family: Arial">
    Znacznik SPAN (blok 2)→>19.03.2026 15:35
  </span>
  <br />
  <span
    style="
      color: #008000;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 9mm;
    "
    ><br />
    Zastosowanie DIV
    <ul type="circle">
      <li>
        Elementy wyświetlanie w linii (SPAN) jest elementem liniowym nie mogą
        zawierać elementów blokowych, ale mogą inne elementy wyświetlane w linii
        oraz zwykły tekst.
      </li>
      <li>
        Jeśli chcemy w paragrafie część tekstu wyrożnić czerwonym kolorem, do
        wyodrębnienia tego tekstu nie możemy uzyć elementu div (paragraf z
        zasady nie może zawierać elementów blokowych) tylko span. Wewnątrz DIV
        można oczywiście wpisać również SPAN
      </li>
    </ul>
  </span>
</div>
<!-- koniec bloku DIV-->
<!-- Babiychuk Oleksii -->

</textarea
    >
  </body>
</html>
